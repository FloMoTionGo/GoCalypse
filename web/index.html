<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoCalypse</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/colyseus.js@0.16.22/dist/colyseus.js"></script>
  <script src="sprites.js"></script>
  <script src="pixelScene.js"></script>
</head>
<body>
  <div id="app">
    <section id="lobby">
      <h1>GoCalypse</h1>
      <p class="tagline">4-player Go by the lantern river. Custom captures. A night market.</p>

      <label>
        Server
        <input id="server-input" type="text" value="wss://gocalypse.fly.dev" />
      </label>
      <label>
        Name <span class="hint">(leave blank for a random guest name)</span>
        <input id="name-input" type="text" placeholder="Guest" />
      </label>

      <button id="join-button">Join Game</button>
      <p id="lobby-status" class="status"></p>
    </section>

    <section id="game" hidden>
      <header id="game-header">
        <div id="room-status"></div>
        <div id="turn-indicator"></div>
      </header>

      <div id="game-body">
        <div id="board-wrap">
          <canvas id="board" class="px"></canvas>
          <p id="board-hint" class="hint">Left click: your color &middot; Right click: your grey pattern stone</p>
          <p id="notice" class="status notice"></p>
          <p id="last-event" class="status"></p>
        </div>

        <aside id="sidebar">
          <div id="players" class="panel"></div>

          <div id="wallet" class="panel"></div>

          <div id="satchel" class="panel">
            <h3>Satchel</h3>
            <div id="satchel-items"></div>
            <p id="targeting-hint" class="hint" hidden></p>
          </div>

          <div id="market" class="panel">
            <h3>Night Market</h3>
            <p id="market-status" class="hint"></p>
            <div id="market-items"></div>
          </div>
        </aside>
      </div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
